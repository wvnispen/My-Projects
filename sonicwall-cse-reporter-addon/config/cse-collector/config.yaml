# SonicWall CSE Events Collector Configuration
# /etc/cse-collector/config.yaml

# CSE API Configuration
# For European Command Center, use: https://eucc.console.banyanops.com/api/v1/events
cse_api_url: "https://net.banyanops.com/api/v1/events"

# API Key - prefer using environment variable CSE_API_KEY for security
# Uncomment and set if not using environment variable:
# cse_api_key: "your-api-key-here"

# Loki Configuration
loki_url: "http://localhost:3100/loki/api/v1/push"

# Collection Settings
poll_interval_seconds: 60
batch_size: 1000
lookback_minutes: 5  # How far back to look on first run

# Cursor file to track position
cursor_file: "/var/lib/cse-collector/cursor.json"

# Logging
log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
log_file: "/var/log/cse-collector/collector.log"

# Default labels applied to all events
labels:
  job: "sonicwall-cse"
  source: "api"
  product: "sonicwall-cse"
